[package]
name = "jrdroid"
version = "0.1.0"
edition = "2021"
publish = false

[features]
host-jni = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
receiver-core = { path = "../vendor/crates/receiver-core", default-features = false }
serde_json = "1"
jni = "=0.21.1"

[dev-dependencies]
receiver-core = { path = "../vendor/crates/receiver-core", default-features = false, features = ["synthesis"] }
jr-demod-eval = { path = "../vendor/crates/demod-eval" }

