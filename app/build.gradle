plugins { id 'com.android.application' }

android {
    namespace 'jp.jrdroid'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'jp.jrdroid'
        minSdk 28
        targetSdk 36
        versionCode 6
        versionName '0.3.0-alpha'
        resValue 'string', 'app_name', 'JRDroid'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        standalone {
            initWith debug
            applicationIdSuffix '.standalone'
            versionNameSuffix '-standalone'
            resValue 'string', 'app_name', 'JRDroid 別インストール'
            signingConfig signingConfigs.debug
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

def nativeBuild = tasks.register('buildRust', Exec) {
    workingDir rootDir
    commandLine 'bash', 'scripts/build-native.sh'
    environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
    inputs.dir('src/main/java')
    inputs.dir(rootProject.file('native/bridge'))
    inputs.dir(rootProject.file('native/vendor'))
    inputs.file(rootProject.file('native/Cargo.toml'))
    inputs.file(rootProject.file('native/Cargo.lock'))
    inputs.file(rootProject.file('scripts/build-native.sh'))
    inputs.file(rootProject.file('rust-toolchain.toml'))
    outputs.file('src/main/jniLibs/arm64-v8a/libjrdroid.so')
}
tasks.named('preBuild').configure { dependsOn nativeBuild }
